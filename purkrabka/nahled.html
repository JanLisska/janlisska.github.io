function relevantMail(){const plain=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();return [...messages()].sort((a,b)=>score(b)-score(a)).slice(0,3);function score(m){return (/skolapurkrabka\.cz/i.test(m.from)?4:0)+(/tyden|porad|druzin|prostor|supl|slavnost|dotaznik/.test(plain(m.subject))?3:0)+(m.unread?1:0)}}
function renderContent(){if(!S.data)return;let html='';
 if(S.tab==='home'){const today=entries().filter(e=>e.date===S.data.today);const first=today.filter(e=>e.start).sort((a,b)=>a.start.localeCompare(b.start))[0];const todayLine=S.data.plan.ok?(today.length?`Na dnešek máte v plánu ${today.length} ${today.length===1?'zápis':today.length<5?'zápisy':'zápisů'}. ${first?'První uvedený čas je '+first.start+'.':''}`:'Na dnešek není v týdenním plánu žádný zápis.'):'Dnešní plán se zatím nepodařilo ověřit.';html=`<section class="intro"><small>${fmt(S.data.today,{weekday:'long',day:'numeric',month:'long'})}</small><h2>Co si dnes pohlídat</h2><p>${esc(todayLine)}</p><button class="quiet" data-action="nav" data-id="week">Otevřít týdenní plán</button></section><div class="home-columns"><section class="home-col"><div class="section-title"><h2>Dnes v plánu</h2><button class="quiet" data-action="nav" data-id="week">Celý týden</button></div>${warning('plan')}${today.slice(0,5).map(eventCard).join('')||'<div class="empty">Žádné načtené zápisy pro dnešek.</div>'}</section><section class="home-col"><div class="section-title"><h2>Z poslední pošty</h2><button class="quiet" data-action="nav" data-id="mail">Pošta</button></div>${warning('mail')}${relevantMail().map(mailCard).join('')||'<div class="empty">Zatím žádné načtené zprávy.</div>'}<p class="note">Výběr z nejvýše 20 přijatých zpráv za 14 dní. E-maily nejsou automaticky zapsané do plánu.</p></section></div>`}
 if(S.tab==='week'){const list=entries().filter(e=>(S.area==='all'||e.area===S.area)&&(!S.q||[e.title,e.body,e.target].join(' ').toLocaleLowerCase('cs').includes(S.q.toLocaleLowerCase('cs'))));html=`<div class="week-nav"><button data-action="week" data-step="-1">Předchozí</button><strong>${fmt(S.week)} – ${fmt(day(S.week,4))}</strong><button data-action="week" data-step="1">Další</button></div><div class="pills"><button data-action="day" data-id="all" class="${S.day==='all'?'active':''}">Celý týden</button>${names.map((n,i)=>`<button data-action="day" data-id="${i}" class="${S.day===i?'active':''}">${n.slice(0,2)}</button>`).join('')}</div><div class="filters"><select id="area" aria-label="Oblast plánu">${Object.entries(areas).map(([id,name])=>`<option value="${id}" ${S.area===id?'selected':''}>${name}</option>`).join('')}</select><button class="quiet" data-action="current">Tento týden</button></div>${warning('plan')}${S.data.plan.data?.missing?'<div class="empty">Pro tento týden v tabulce není odpovídající list.</div>':''}${S.data.plan.data?.note?`<p class="note">${esc(S.data.plan.data.note)}</p>`:''}<div class="${S.day==='all'?'week-content':''}">${names.map((n,i)=>{if(S.day!=='all'&&S.day!==i)return '';const d=day(S.week,i),posts=list.filter(e=>e.date===d).sort((a,b)=>(a.start||'00:00').localeCompare(b.start||'00:00'));return `<section class="day-group"><div class="day-heading"><strong>${n}</strong><span>${fmt(d)}</span></div>${posts.map(eventCard).join('')||'<div class="empty">Bez zápisu pro tento výběr.</div>'}</section>`}).join('')}</div>`}
 if(S.tab==='rooms'){const days=S.data.rooms.data?.days||[],d=days[S.roomsDay];html=`<div class="pills">${names.map((n,i)=>`<button data-action="rooms-day" data-id="${i}" class="${S.roomsDay===i?'active':''}">${n}</button>`).join('')}</div>${warning('rooms')}<p class="note">Pravidelný rozpis. Mimořádné změny ověřte v týdenním plánu a poště.</p>${d?d.rooms.map(r=>{const booked=r.items.filter(i=>i.text);return `<details class="card room"><summary>${esc(r.name)} <small>${booked.length?'rozpis':'bez zápisu'}</small></summary>${booked.map(i=>`<div class="room-slot"><span>${esc(i.slot)}</span><span>${esc(i.text)}</span></div>`).join('')||'<p class="note">V tomto rozpisu nejsou zapsané žádné činnosti.</p>'}</details>`}).join(''):'<div class="empty">Rozpis prostor zatím není načtený.</div>'}${S.data.rooms.data?`<div class="dialog-actions">${source(S.data.rooms.data.source)}</div>`:''}`}
 if(S.tab==='mail'){const q=S.q.toLocaleLowerCase('cs');html=`<p class="note">Načteno ${messages().length} přijatých zpráv za posledních 14 dní${S.data.mail.data?.hasMore?' · výběr nejnovějších':''}.</p>${warning('mail')}${messages().filter(m=>[m.subject,m.from,m.snippet].join(' ').toLocaleLowerCase('cs').includes(q)).map(mailCard).join('')||'<div class="empty">Žádné zprávy pro tento výběr.</div>'}`}
 if(S.tab==='more'){const data=S.data.sources.data;html=`<div class="account">Osobní účet<strong>${esc(S.data.account)}</strong><span>Čtení Google tabulek, dokumentů a pošty.</span></div>${warning('sources')}${data?`<div class="section-title"><h2>E-nástěnka</h2></div><div class="tab-grid">${data.board.tabs.map(t=>`<button class="link-row" data-action="table" data-file="${esc(data.board.id)}" data-tab="${t.id}">${esc(t.name)}<span>Otevřít</span></button>`).join('')}</div><div class="section-title"><h2>Porady</h2></div><button class="link-row" data-action="minutes">Zápisy z porad<span>Číst</span></button><div class="section-title"><h2>Další zdroje</h2></div>${data.additional.map((id,i)=>`<button class="link-row" data-action="source-tabs" data-id="${esc(id)}">Přidaná tabulka ${i+1}<span>Otevřít listy</span></button>`).join('')}<button class="secondary" data-action="discover">Najít další tabulky na Disku</button>`:''}<p class="note">Obnova probíhá při otevření a tlačítkem Obnovit. Tato verze nepřepisuje zdrojové tabulky ani neodesílá e-maily.</p>`}
 $('content').innerHTML=html;
}
function dialog(title,body){$('detail')?.remove();const d=document.createElement('dialog');d.id='detail';d.innerHTML=`<div class="dialog-head"><h2>${esc(title)}</h2><button class="close" data-action="close" aria-label="Zavřít">×</button></div>${body}`;document.body.append(d);d.showModal();return d}
function showEntry(id,info=false){const e=entries().find(e=>e.id===id);if(!e)return;dialog(info?'Info o zápisu':e.title,info?`<div class="info-list"><b>Zdroj</b>${esc(e.sourceName||'Týdenní plány')}<b>List a buňka</b>${esc(e.sourceSheet||S.data.plan.data?.title||'')} · ${esc(e.cell)}<b>Načteno z Google Tabulek</b>${S.data.plan.readAt?fmt(S.data.plan.readAt,{day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'}):'Neověřeno'}<b>Autor a historie buňky</b>Google při tomto čtení autora jednotlivé buňky neposkytuje. Historii zjistíte v původní tabulce.</div><div class="dialog-actions">${source(e.source,'Otevřít buňku '+e.cell)}<button class="secondary" data-action="entry" data-id="${esc(id)}">Podrobnosti</button></div>`:`<p class="subtitle">${fmt(e.date,{weekday:'long',day:'numeric',month:'long'})}${e.start?' · '+esc(e.start):''}</p><p class="note">${esc(e.target)}</p><div class="body-text">${esc(e.body)}</div><div class="dialog-actions">${source(e.source,'Otevřít buňku '+e.cell)}<button class="secondary" data-action="info" data-id="${esc(id)}">ⓘ Info</button></div>`)}
async function requestDialog(title,name,arg,render){const d=dialog(title,'<p>Načítání…</p>');try{const data=await rpc(name,arg);if(!d.isConnected)return;d.innerHTML=`<div class="dialog-head"><h2>${esc(title)}</h2><button class="close" data-action="close" aria-label="Zavřít">×</button></div>${render(data)}`}catch(e){if(d.isConnected)d.innerHTML=`<div class="dialog-head"><h2>${esc(title)}</h2><button class="close" data-action="close" aria-label="Zavřít">×</button></div><p class="source-error">${esc(errText(e))}</p>`}}
function tableBody(t){const rows=t.rows.filter(r=>r.some(c=>String(c??'').trim())),width=Math.max(0,...rows.map(r=>r.length));return `<p class="note">Výřez nejvýše 45 řádků a 20 sloupců. Celý obsah je v originálu.</p><div class="table-scroll"><table class="data-table"><caption>${esc(t.title)}</caption><tbody>${rows.map(r=>`<tr>${Array.from({length:width},(_,i)=>`<td>${esc(r[i]??'')}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="dialog-actions">${source(t.source)}</div>`}
document.addEventListener('click',event=>{const b=event.target.closest('button[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id;switch(a){case'nav':$('detail')?.close();go(id);break;case'close':b.closest('dialog')?.close();break;case'refresh':load(true);break;case'entry':showEntry(id);break;case'info':showEntry(id,true);break;case'day':S.day=id==='all'?'all':+id;renderContent();break;case'rooms-day':S.roomsDay=+id;renderContent();break;case'week':S.week=day(S.week,+b.dataset.step*7);load(false);break;case'current':S.week=null;load(false);break;case'mail':requestDialog('Zpráva','getMail',id,m=>`<h3>${esc(m.subject)}</h3><p class="note">${esc(m.from)} · ${fmt(m.date,{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'})}</p><div class="body-text">${esc(m.body)}</div><div class="dialog-actions">${source(m.source,'Otevřít v Gmailu')}</div>`);break;case'table':requestDialog('Přehled z tabulky','getTable',{fileId:b.dataset.file,tabId:+b.dataset.tab},tableBody);break;case'minutes':requestDialog('Zápisy z porad','getMinutes',undefined,m=>`<div class="body-text">${esc(m.body)}</div>${m.truncated?'<p class="note">Zobrazený je výřez dokumentu.</p>':''}<div class="dialog-actions">${source(m.source)}</div>`);break;case'discover':requestDialog('Tabulky na školním Disku','listOtherTables',undefined,files=>'<p class="note">Nejvýše 30 nedávno upravených tabulek. Vyberte zdroj pro přidání do přehledů.</p>'+files.filter(f=>![S.data.sources.data?.board?.id,'11YsjgJ12DkVn7OvWUjh0aLtfDj86Nu0VmJUg613LmyE'].includes(f.id)).map(f=>`<button class="link-row" data-action="add-source" data-id="${esc(f.id)}">${esc(f.name)}<span>Přidat</span></button>`).join(''));break;case'add-source':case'source-tabs':requestDialog('Listy tabulky',a==='add-source'?'addSource':'getSourceTabs',id,s=>{if(a==='add-source')load(true);return `<p class="note">${esc(s.title)}</p>${s.tabs.map(t=>`<button class="link-row" data-action="table" data-file="${esc(s.id)}" data-tab="${t.id}">${esc(t.name)}<span>Otevřít</span></button>`).join('')}`});break}});
document.addEventListener('change',e=>{if(e.target.id==='area'){S.area=e.target.value;renderContent()}});$('search').addEventListener('input',e=>{S.q=e.target.value;renderContent()});render();load(false);
</script></body></html>
